<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc"><title id="title">Validate, revise and recover</title><desc id="desc">Checks determine whether work advances, returns or waits. A failed check returns to revision; missing evidence remains unresolved.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52667f"/></marker></defs><rect width="800" height="760" rx="16" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#152d4a">Validate, revise and recover</text><text x="40" y="80" font-size="17" fill="#52667f">Checks determine whether work advances, returns or waits.</text><path d="M200 213 V295" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M340 319 H395 V169 H450" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="412" y="255" font-size="16" fill="#52667f">Failed check</text><path d="M590 125 V105 H200 V125" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M340 356 H450" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="352" y="405" font-size="16" fill="#52667f">Unknown</text><path d="M590 383 V445 H395 V367 H340" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M200 383 V495" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="214" y="451" font-size="16" fill="#52667f">Pass</text><rect x="60" y="125" width="280" height="88" rx="12" fill="#203f66"/><text x="200" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="white">Generate materials</text><text x="200" y="188" text-anchor="middle" font-size="16" fill="white">Use verified experience</text><rect x="60" y="295" width="280" height="88" rx="12" fill="#203f66"/><text x="200" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="white">Validate</text><text x="200" y="358" text-anchor="middle" font-size="16" fill="white">Check content and evidence</text><rect x="450" y="125" width="280" height="88" rx="12" fill="#203f66"/><text x="590" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="white">Revise</text><text x="590" y="188" text-anchor="middle" font-size="16" fill="white">Correct the identified issue</text><rect x="450" y="295" width="280" height="88" rx="12" fill="#855a19"/><text x="590" y="330" text-anchor="middle" font-size="20" font-weight="700" fill="white">Hold for evidence</text><text x="590" y="358" text-anchor="middle" font-size="16" fill="white">Resolve the missing input</text><rect x="60" y="495" width="280" height="88" rx="12" fill="#0d6c64"/><text x="200" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="white">Human approval</text><text x="200" y="558" text-anchor="middle" font-size="16" fill="white">Review the validated version</text><path d="M40 682 H760" stroke="#cbd5e1"/><text x="40" y="716" font-size="16" fill="#52667f">A failed check returns to revision; missing evidence remains unresolved.</text></g></svg>
