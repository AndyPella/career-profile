<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc"><title id="title">Track events, not assumptions</title><desc id="desc">Preparation, approval and confirmed submission are distinct events. Generated or approved materials alone do not establish an application.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52667f"/></marker></defs><rect width="800" height="760" rx="16" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#152d4a">Track events, not assumptions</text><text x="40" y="80" font-size="17" fill="#52667f">Preparation, approval and confirmed submission are distinct events.</text><path d="M205 213 V290" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="215" y="258" font-size="16" fill="#52667f">Review</text><path d="M205 378 V465" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="220" y="430" font-size="16" fill="#52667f">Submit + confirm</text><path d="M350 334 H450" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="357" y="278" font-size="16" fill="#52667f">No evidence</text><path d="M350 509 H450" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M595 378 V465" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="595" y="430" font-size="16" fill="#52667f">Record uncertainty</text><rect x="60" y="125" width="290" height="88" rx="12" fill="#203f66"/><text x="205" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="white">Materials prepared</text><text x="205" y="188" text-anchor="middle" font-size="16" fill="white">A document exists</text><rect x="60" y="290" width="290" height="88" rx="12" fill="#0d6c64"/><text x="205" y="325" text-anchor="middle" font-size="20" font-weight="700" fill="white">Materials approved</text><text x="205" y="353" text-anchor="middle" font-size="16" fill="white">The person accepts this version</text><rect x="60" y="465" width="290" height="88" rx="12" fill="#0d6c64"/><text x="205" y="500" text-anchor="middle" font-size="20" font-weight="700" fill="white">Submission confirmed</text><text x="205" y="528" text-anchor="middle" font-size="16" fill="white">Evidence establishes the event</text><rect x="450" y="290" width="290" height="88" rx="12" fill="#855a19"/><text x="595" y="325" text-anchor="middle" font-size="20" font-weight="700" fill="white">Submission unconfirmed</text><text x="595" y="353" text-anchor="middle" font-size="16" fill="white">Keep the status unresolved</text><rect x="450" y="465" width="290" height="88" rx="12" fill="#203f66"/><text x="595" y="500" text-anchor="middle" font-size="20" font-weight="700" fill="white">Opportunity record</text><text x="595" y="528" text-anchor="middle" font-size="16" fill="white">Retain events and current status</text><path d="M40 682 H760" stroke="#cbd5e1"/><text x="40" y="716" font-size="16" fill="#52667f">Generated or approved materials alone do not establish an application.</text></g></svg>
