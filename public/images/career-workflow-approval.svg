<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc"><title id="title">Human gates control progression</title><desc id="desc">System assistance supports consequential decisions. Approval of materials and confirmation of submission stay separate.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52667f"/></marker></defs><rect width="800" height="760" rx="16" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#152d4a">Human gates control progression</text><text x="40" y="80" font-size="17" fill="#52667f">System assistance supports consequential decisions.</text><path d="M330 179 H470" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M610 223 V280 H190 V335" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M330 379 H470" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M610 423 V535" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M470 579 H330" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><rect x="50" y="135" width="280" height="88" rx="12" fill="#203f66"/><text x="190" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="white">Evaluate opportunities</text><text x="190" y="198" text-anchor="middle" font-size="16" fill="white">System presents fit and gaps</text><rect x="470" y="135" width="280" height="88" rx="12" fill="#0d6c64"/><text x="610" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="white">Choose a pursuit</text><text x="610" y="198" text-anchor="middle" font-size="16" fill="white">Human decision</text><rect x="50" y="335" width="280" height="88" rx="12" fill="#203f66"/><text x="190" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="white">Prepare and validate</text><text x="190" y="398" text-anchor="middle" font-size="16" fill="white">System creates reviewable work</text><rect x="470" y="335" width="280" height="88" rx="12" fill="#0d6c64"/><text x="610" y="370" text-anchor="middle" font-size="20" font-weight="700" fill="white">Approve materials</text><text x="610" y="398" text-anchor="middle" font-size="16" fill="white">Human decision</text><rect x="470" y="535" width="280" height="88" rx="12" fill="#0d6c64"/><text x="610" y="570" text-anchor="middle" font-size="20" font-weight="700" fill="white">Submit and confirm</text><text x="610" y="598" text-anchor="middle" font-size="16" fill="white">Human action and evidence</text><rect x="50" y="535" width="280" height="88" rx="12" fill="#203f66"/><text x="190" y="570" text-anchor="middle" font-size="20" font-weight="700" fill="white">Track and summarize</text><text x="190" y="598" text-anchor="middle" font-size="16" fill="white">System uses confirmed state</text><path d="M40 682 H760" stroke="#cbd5e1"/><text x="40" y="716" font-size="16" fill="#52667f">Approval of materials and confirmation of submission stay separate.</text></g></svg>
