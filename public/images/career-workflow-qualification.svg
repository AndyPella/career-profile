<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc"><title id="title">From a lead to a pursuit decision</title><desc id="desc">Evidence determines the next path; the person chooses what to pursue. A discovered opportunity becomes a recommendation only after evaluation.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52667f"/></marker></defs><rect width="800" height="760" rx="16" fill="#f5f7fb"/><g font-family="Arial, sans-serif"><text x="40" y="49" font-size="26" font-weight="700" fill="#152d4a">From a lead to a pursuit decision</text><text x="40" y="80" font-size="17" fill="#52667f">Evidence determines the next path; the person chooses what to pursue.</text><path d="M400 203 V265" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><path d="M400 353 V405 H145 V465" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="140" y="394" font-size="16" fill="#52667f">Unknown</text><path d="M400 353 V465" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="410" y="433" font-size="16" fill="#52667f">Supported</text><path d="M400 353 V405 H655 V465" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><text x="565" y="394" font-size="16" fill="#52667f">Not suitable</text><path d="M400 553 V585" fill="none" stroke="#52667f" stroke-width="2.5" marker-end="url(#a)"/><rect x="270" y="115" width="260" height="88" rx="12" fill="#203f66"/><text x="400" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="white">Discover a lead</text><text x="400" y="178" text-anchor="middle" font-size="16" fill="white">Record the opportunity</text><rect x="270" y="265" width="260" height="88" rx="12" fill="#203f66"/><text x="400" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="white">Evaluate evidence</text><text x="400" y="328" text-anchor="middle" font-size="16" fill="white">Compare fit and constraints</text><rect x="40" y="465" width="210" height="88" rx="12" fill="#855a19"/><text x="145" y="500" text-anchor="middle" font-size="20" font-weight="700" fill="white">Hold for evidence</text><text x="145" y="528" text-anchor="middle" font-size="16" fill="white">Keep unknowns visible</text><rect x="295" y="465" width="210" height="88" rx="12" fill="#203f66"/><text x="400" y="500" text-anchor="middle" font-size="20" font-weight="700" fill="white">Recommend</text><text x="400" y="528" text-anchor="middle" font-size="16" fill="white">Explain fit and gaps</text><rect x="550" y="465" width="210" height="88" rx="12" fill="#855a19"/><text x="655" y="500" text-anchor="middle" font-size="20" font-weight="700" fill="white">Do not pursue</text><text x="655" y="528" text-anchor="middle" font-size="16" fill="white">Record the reason</text><rect x="295" y="585" width="210" height="88" rx="12" fill="#0d6c64"/><text x="400" y="620" text-anchor="middle" font-size="20" font-weight="700" fill="white">Human decision</text><text x="400" y="648" text-anchor="middle" font-size="16" fill="white">Choose next action</text><path d="M40 682 H760" stroke="#cbd5e1"/><text x="40" y="716" font-size="16" fill="#52667f">A discovered opportunity becomes a recommendation only after evaluation.</text></g></svg>
